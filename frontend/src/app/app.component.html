<div class="bg-white dark:bg-gray-800 min-h-screen">
  <header class="relative flex justify-between items-center p-4">
    <h1 class="text-gray-900 dark:text-white text-xl font-bold">
      <a routerLink="/" class="inline-block py-2 -my-2">Gestor de tareas</a>
    </h1>

    <div class="flex items-center gap-3">
    @if (auth.usuario(); as usuario) {
    <span class="hidden sm:inline text-sm text-gray-600 dark:text-gray-300">{{ usuario.nombre }}</span>
    }

    <button type="button" (click)="toggleMenu()" class="relative w-10 h-10 flex flex-col justify-center items-center gap-1.5"
      [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'" [attr.aria-expanded]="menuAbierto()">
      <span class="block h-0.5 w-6 bg-gray-900 dark:bg-white transition-transform" [class.rotate-45]="menuAbierto()"
        [class.translate-y-2]="menuAbierto()"></span>
      <span class="block h-0.5 w-6 bg-gray-900 dark:bg-white transition-opacity"
        [class.opacity-0]="menuAbierto()"></span>
      <span class="block h-0.5 w-6 bg-gray-900 dark:bg-white transition-transform" [class.-rotate-45]="menuAbierto()"
        [class.-translate-y-2]="menuAbierto()"></span>
    </button>
    </div>

    @if (menuAbierto()) {
    <div class="absolute right-4 top-14 bg-white dark:bg-gray-700 shadow-lg rounded p-3 flex flex-col gap-2 z-10">
      @if (auth.usuario(); as usuario) {
      <p class="px-3 pb-2 mb-1 border-b border-gray-200 dark:border-gray-600 text-sm text-gray-600 dark:text-gray-300">
        Has entrado como <span class="font-semibold text-gray-900 dark:text-white">{{ usuario.nombre }}</span>
      </p>
      }
      <button type="button" (click)="cambiarTema()"
        class="px-3 py-2 sm:py-1 rounded bg-gray-200 dark:bg-gray-600 text-gray-900 dark:text-white text-left whitespace-nowrap">
        {{ theme.theme() === 'dark' ? '☀️ Modo claro' : '🌙 Modo oscuro' }}
      </button>
      @if (auth.usuario()) {
      <button type="button" (click)="cerrarSesion()"
        class="px-3 py-2 sm:py-1 rounded text-left whitespace-nowrap text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30">
        Cerrar sesión
      </button>
      }
    </div>
    }
  </header>

  <router-outlet></router-outlet>

  <!-- Ventana de confirmación compartida por toda la app (la abre ConfirmService) -->
  <app-confirm-dialog />
</div>
