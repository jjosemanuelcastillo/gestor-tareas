# Configuración solo para los tests: base de datos H2 en memoria (no hace falta MySQL)
spring.application.name=gestor-tareas
spring.datasource.url=jdbc:h2:mem:gestor_tareas;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=clave-de-los-tests-con-longitud-suficiente-para-hs256
app.jwt.expiration=8h

# Dos orígenes, para probar que la lista separada por comas funciona
app.cors.allowed-origins=http://localhost:4200,https://gestor-tareas-demo.vercel.app

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
