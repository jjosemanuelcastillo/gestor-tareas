# Configuración solo para los tests: base de datos H2 en memoria (no hace falta MySQL)
spring.application.name=gestor-tareas
spring.datasource.url=jdbc:h2:mem:gestor_tareas;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=clave-de-los-tests-con-longitud-suficiente-para-hs256
app.jwt.expiration=8h
