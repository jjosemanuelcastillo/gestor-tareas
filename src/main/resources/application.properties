spring.application.name=gestor-tareas
spring.datasource.url=jdbc:mysql://localhost:3306/gestor_tareas
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
# La clave que firma los tokens se lee de la variable de entorno JWT_SECRET (mínimo 32 caracteres).
# El valor de después de ":" es SOLO PARA DESARROLLO. En producción hay que definir JWT_SECRET.
app.jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-no-usar-en-produccion-123456}
app.jwt.expiration=8h
