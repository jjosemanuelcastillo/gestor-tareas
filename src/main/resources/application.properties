spring.application.name=gestor-tareas
spring.datasource.url=jdbc:mysql://localhost:3306/gestor_tareas
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Secretos locales (como JWT_SECRET) en un archivo que NO se sube a GitHub.
# Copia .env.properties.example como .env.properties y rellénalo.
spring.config.import=optional:file:./.env.properties

# JWT
# La clave que firma los tokens (mínimo 32 caracteres). Sin valor por defecto a propósito:
# si falta JWT_SECRET (variable de entorno o .env.properties), la aplicación no arranca.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=8h
