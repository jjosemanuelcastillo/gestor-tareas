spring.application.name=gestor-tareas

# Puerto: en Render lo decide la plataforma con la variable PORT; en local, 8080
server.port=${PORT:8080}

# Base de datos local. En producción se sustituye con las variables de entorno
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD
# (Spring Boot las lee solo, sin tocar este archivo).
spring.datasource.url=jdbc:mysql://localhost:3306/gestor_tareas
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Las consultas se hacen en los servicios, no al pintar la respuesta
spring.jpa.open-in-view=false

# Secretos locales (como JWT_SECRET) en un archivo que NO se sube a GitHub.
# Copia .env.properties.example como .env.properties y rellénalo.
spring.config.import=optional:file:./.env.properties

# JWT
# La clave que firma los tokens (mínimo 32 caracteres). Sin valor por defecto a propósito:
# si falta JWT_SECRET (variable de entorno o .env.properties), la aplicación no arranca.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=8h

# CORS: webs que pueden llamar a la API (separadas por comas). En producción, la de Vercel.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Actuator: solo se publica /actuator/health, y sin detalles
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
